version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jd_studio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: john_deere_studio
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: jd_idea_value_studio
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:rootpassword@db:3306/john_deere_studio
      - JWT_SECRET=local-mac-development-secret-key-change-in-production
    depends_on:
      - db

volumes:
  mysql_data:
